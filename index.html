<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>헤일리 중등부 내신 100점 관리 마스터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --mint:#10b981; --mint-d:#059669; --mint-soft:#d1fae5; --mint-bg:#f0fdf9;
    --ink:#0f2e29; --ink-soft:#46635c; --line:#cdeee2;
    --bad:#ef4444; --bad-bg:#fef2f2; --warn:#f59e0b; --lock:#9aa8a4;
    --card:#fff; --shadow:0 8px 28px rgba(16,185,129,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Pretendard',-apple-system,sans-serif; color:var(--ink);
    background:radial-gradient(1400px 700px at 85% -10%,#c6f6e6 0,transparent 55%),
               radial-gradient(1000px 600px at -10% 110%,#d9f7ec 0,transparent 50%),var(--mint-bg);
    overflow:hidden;
  }
  #app{height:100vh;display:flex;flex-direction:column;max-width:1100px;margin:0 auto}
  .top{display:flex;align-items:center;gap:14px;padding:16px 26px;flex-shrink:0}
  .top .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--mint),var(--mint-d));
    color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px;box-shadow:var(--shadow)}
  .top .ti{font-size:14px;font-weight:800;letter-spacing:-.02em}
  .top .ti small{display:block;font-size:11px;color:var(--mint-d);font-weight:700;margin-top:1px}
  .top .timer{margin-left:12px;display:none;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);
    border-radius:99px;padding:7px 17px;font-weight:800;font-size:16px;color:var(--mint-d)}
  .top .timer.warn{color:var(--bad);border-color:var(--bad)}
  .top .timer .lbl{font-size:11px;color:var(--ink-soft);font-weight:700}
  .top .back{margin-left:auto;background:#fff;border:1.5px solid var(--line);border-radius:11px;
    padding:9px 16px;font-family:inherit;font-weight:700;font-size:14px;color:var(--ink-soft);cursor:pointer}
  .body{flex:1;overflow-y:auto;padding:8px 26px 30px;-webkit-overflow-scrolling:touch}
  .screen{display:none;animation:fade .3s ease}
  .screen.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  h1{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-bottom:8px}
  .sub{color:var(--ink-soft);font-size:16px;margin-bottom:26px}
  /* 큰 선택 카드 */
  .bigcards{display:grid;gap:18px}
  .bigcards.c2{grid-template-columns:1fr 1fr}
  .bigcards.c3{grid-template-columns:1fr 1fr 1fr}
  .bigcard{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:36px 30px;
    cursor:pointer;transition:.16s;text-align:left;font-family:inherit;display:flex;flex-direction:column;
    gap:9px;min-height:148px;justify-content:center}
  .bigcard:active{transform:scale(.98)}
  .bigcard:hover{border-color:var(--mint);box-shadow:var(--shadow)}
  .bigcard .nm{font-size:25px;font-weight:800;letter-spacing:-.02em}
  .bigcard .ds{font-size:16px;color:var(--ink-soft)}
  .bigcard .stp{font-size:13px;font-weight:800;color:var(--mint-d);background:var(--mint-soft);
    padding:5px 13px;border-radius:99px;align-self:flex-start}
  .bigcard.wide{min-height:120px;align-items:flex-start}
  /* 잠금 카드 */
  .bigcard.locked{border-color:var(--line);background:#f5f8f7;cursor:not-allowed;opacity:.85}
  .bigcard.locked:hover{box-shadow:none;border-color:var(--line)}
  .bigcard.locked .nm{color:var(--lock)}
  .bigcard .lockrow{display:flex;align-items:center;gap:8px}
  .lockbadge{font-size:12px;font-weight:800;color:var(--lock);border:1.5px solid var(--line);
    border-radius:99px;padding:4px 12px;align-self:flex-start}
  /* 문제 화면 */
  .qwrap{max-width:800px;margin:0 auto}
  .qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .qtag{font-size:13px;font-weight:800;color:#fff;background:var(--mint);padding:5px 13px;border-radius:99px}
  .qnum{font-size:14px;color:var(--ink-soft);font-weight:700}
  .qcard{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:26px;box-shadow:var(--shadow)}
  .prompt{background:var(--mint-bg);border:1px dashed var(--line);border-radius:13px;padding:15px 17px;
    font-size:17px;line-height:1.6;margin-bottom:18px}
  .stem{font-size:19px;font-weight:700;line-height:1.5;margin-bottom:20px}
  .opts{display:grid;gap:11px}
  .opt{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:13px;
    padding:15px 17px;cursor:pointer;font-size:17px;transition:.12s}
  .opt:active{transform:scale(.99)} .opt:hover{border-color:var(--mint)}
  .opt .ci{width:27px;height:27px;border-radius:50%;border:1.7px solid var(--ink-soft);display:grid;place-items:center;
    font-size:13px;font-weight:800;color:var(--ink-soft);flex-shrink:0}
  .opt.sel{border-color:var(--mint);background:var(--mint-bg)} .opt.sel .ci{background:var(--mint);border-color:var(--mint);color:#fff}
  .opt.ok{border-color:var(--mint);background:var(--mint-soft)} .opt.ok .ci{background:var(--mint);border-color:var(--mint);color:#fff}
  .opt.no{border-color:var(--bad);background:var(--bad-bg)} .opt.no .ci{background:var(--bad);border-color:var(--bad);color:#fff}
  /* 클로즈 */
  .cloze{font-size:19px;line-height:2.2;margin-bottom:8px}
  .blank{display:inline-block;min-width:78px;border-bottom:2.5px solid var(--mint);color:var(--mint-d);
    font-weight:800;text-align:center;padding:0 6px;cursor:pointer;border-radius:5px 5px 0 0}
  .blank.cur{background:var(--mint-soft)}
  .blank.done-ok{color:var(--mint-d)} .blank.done-no{color:var(--bad);border-color:var(--bad)}
  .clozeopts{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
  .clozeopt{border:1.5px solid var(--line);border-radius:11px;padding:12px 20px;font-size:17px;font-weight:600;cursor:pointer}
  .clozeopt:hover{border-color:var(--mint)}
  .winput{width:100%;border:1.5px solid var(--line);border-radius:13px;padding:15px 17px;font-family:inherit;font-size:18px}
  .winput:focus{outline:none;border-color:var(--mint)}
  /* 어법 선택(둘 중 고르기) 버튼 */
  .optpick{font-family:inherit;font-size:18px;font-weight:700;border:1.5px solid var(--line);background:#fff;
    color:var(--ink);border-radius:10px;padding:6px 16px;margin:0 2px;cursor:pointer;transition:.12s}
  .optpick:hover{border-color:var(--mint)}
  .optpick.on{border-color:var(--mint);background:var(--mint-bg);color:var(--mint-d)}
  .optpick.cpick-ok{border-color:var(--mint);background:var(--mint-soft);color:var(--mint-d)}
  .optpick.cpick-no{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
  /* 선생님 링크(작게) */
  .teacherlink{margin-top:18px;background:none;border:none;color:var(--ink-soft);font-family:inherit;
    font-size:13px;font-weight:700;cursor:pointer;text-decoration:underline;opacity:.7}
  .teacherlink:hover{opacity:1;color:var(--mint-d)}
  /* 선생님/기록 행 */
  .trow{display:flex;justify-content:space-between;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);font-size:15px}
  .trow:last-child{border-bottom:none}
  /* 순서배열 칩 (이미지 스타일) */
  .built{min-height:44px;background:var(--mint-bg);border:1px dashed var(--line);border-radius:12px;
    padding:13px 15px;font-size:17px;line-height:1.6;margin-bottom:16px;color:var(--ink)}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{font-family:inherit;font-size:16px;font-weight:600;border:1.5px solid var(--line);background:#fff;
    color:var(--ink);border-radius:12px;padding:11px 16px;cursor:pointer;transition:.12s}
  .chip:hover{border-color:var(--mint)}
  .chip.used{opacity:.35;background:var(--mint-bg);border-color:var(--mint);pointer-events:auto}
  /* 동사형 인라인 입력 */
  .inlinebox{display:inline-flex;align-items:center;gap:5px;margin:0 3px}
  .given{font-size:13px;color:var(--ink-soft);font-weight:700}
  .winline{width:120px;border:1.5px solid var(--line);border-radius:9px;padding:7px 10px;font-family:inherit;font-size:16px}
  .winline:focus{outline:none;border-color:var(--mint)}
  /* 배열 */
  .arr-pool{display:grid;gap:11px}
  .arr-item{border:1.5px solid var(--line);border-radius:13px;padding:16px 18px;font-size:17px;cursor:pointer;
    background:#fff;display:flex;align-items:center;gap:12px;transition:.12s}
  .arr-item:hover{border-color:var(--mint)}
  .arr-item.picked{border-color:var(--mint);background:var(--mint-bg)}
  .arr-item .seq{width:26px;height:26px;border-radius:50%;background:var(--mint);color:#fff;display:none;
    place-items:center;font-size:14px;font-weight:800;flex-shrink:0}
  .arr-item.picked .seq{display:grid}
  /* 피드백/버튼 */
  .fb{margin-top:18px;padding:15px 17px;border-radius:13px;font-size:16px;font-weight:700;display:none}
  .fb.on{display:block} .fb.good{background:var(--mint-soft);color:var(--mint-d)} .fb.bad{background:var(--bad-bg);color:var(--bad)}
  .bar{display:flex;gap:12px;max-width:800px;margin:18px auto 0}
  .btn{flex:1;border:none;border-radius:15px;padding:18px;font-family:inherit;font-size:17px;font-weight:800;cursor:pointer;transition:.15s}
  .btn:active{transform:scale(.99)}
  .btn.primary{background:linear-gradient(135deg,var(--mint),var(--mint-d));color:#fff;box-shadow:var(--shadow)}
  .btn.primary:disabled{opacity:.4;box-shadow:none}
  .btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink-soft);flex:0 0 130px}
  .result{max-width:560px;margin:24px auto 0;text-align:center}
  .result .big{font-size:66px;font-weight:800;color:var(--mint-d);letter-spacing:-.04em}
  .result .lab{color:var(--ink-soft);font-size:16px;margin-top:4px}
  .note{max-width:800px;margin:18px auto 0;font-size:13px;color:var(--ink-soft);background:#fff;
    border:1px dashed var(--line);border-radius:13px;padding:13px 16px;line-height:1.6}
  .login{max-width:400px;margin:6vh auto 0;text-align:center}
  .login .biglogo{width:66px;height:66px;border-radius:19px;background:linear-gradient(135deg,var(--mint),var(--mint-d));
    color:#fff;display:grid;place-items:center;font-size:30px;font-weight:800;margin:0 auto 16px;box-shadow:var(--shadow)}
  .login input{width:100%;border:1.5px solid var(--line);border-radius:13px;padding:15px 16px;font-family:inherit;font-size:16px;margin-bottom:10px}
  .login input:focus{outline:none;border-color:var(--mint)}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="logo">H</div>
    <div class="ti">헤일리 중등부<small>내신 100점 관리 마스터</small></div>
    <button class="back" id="backBtn" style="display:none" onclick="goBack()">← 뒤로</button>
    <div class="timer" id="timer"><span class="lbl">남은 시간</span><span id="timerNum">15</span>초</div>
  </div>
  <div class="body" id="body"></div>
</div>

<script>
/* ===========================================================
   헤일리 중등부 내신 100점 관리 마스터 — 학생용 뼈대 (샘플 데이터)
   🔌 연결 예정: 학교/본문/대화문/단어 → 구글 시트
                어법 문제 → 선생님 PDF 추출
                공통 7유형 문제 → Anthropic API 자동생성
                풀이 기록 → '기록' 시트
   =========================================================== */
const TIMER = { blankMC:15, blankWrite:25, wordMC:15, sentMC:15, grammarMC:20, arrange:60 };
const FEEDBACK_MS = 1200; // 정답/오답 보여주고 자동으로 다음 넘어가는 시간(ms)
// ↑ 시간 제한(초). 여기 숫자만 바꾸면 전체 적용.

/* 🔌 구글 시트 연결 ─ Apps Script 웹앱을 배포하고 받은 주소(.../exec)를 따옴표 안에 붙여넣으세요.
   비워두면 예전처럼 이 태블릿 안에만 저장됩니다. (시트 연결돼도 기기 저장은 항상 같이 됩니다) */
const SHEET_API = "https://script.google.com/macros/s/AKfycbywzQxPjyA4Y1XtURWz1TNytdl-JBZshqIXc2J6o89toWJ4WE_Gbacsz8TvJ8GHJFDzgA/exec";

const SCHOOLS = {
  '중1':[{id:'a',nm:'○○중',bk:'미래엔(문)'}],
  '중2':[{id:'pm',nm:'팔마중',bk:'미래엔(문)'},{id:'ow',nm:'왕의중',bk:'동아(윤)'}],
  '중3':[{id:'ou',nm:'왕운중',bk:'비상(김)'},{id:'gd',nm:'금당중',bk:'동아(이)'}],
};
const WORDS = [
  {en:'camping', ko:'캠핑', def:'staying outdoors in a tent for fun'},
  {en:'river', ko:'강', def:'a large natural stream of water'},
  {en:'cook', ko:'요리하다', def:'to prepare food with heat'},
  {en:'weekend', ko:'주말', def:'Saturday and Sunday'},
  {en:'together', ko:'함께', def:'with each other'},
];
const PASSAGE = [
  {en:'Last weekend my family went camping.', ko:'지난 주말 우리 가족은 캠핑을 갔다.'},
  {en:'We packed our bags in the morning.', ko:'우리는 아침에 가방을 쌌다.'},
  {en:'We cooked dinner together by the river.', ko:'우리는 강가에서 함께 저녁을 요리했다.'},
];
const DIALOGS = {
  '대화문1':[{sp:'A',en:'What are you doing this weekend?',ko:'이번 주말에 뭐 해?'},
            {sp:'B',en:'I am going camping with my family.',ko:'가족이랑 캠핑 갈 거야.'},
            {sp:'A',en:'That sounds fun! Have a great time.',ko:'재밌겠다! 좋은 시간 보내.'}],

const READING_DATA = {"meta":{"school":"헤일리올라","grade":"중2","textbook":"동아(윤정미)","lesson":"Lesson 3","title":"본문 학습"},"passages":[{"id":"p1","label":"본문1 · Bicycle","sentences":[{"no":1,"en":"Mt. Tambora, a volcano in Indonesia, exploded in 1815.","ko":"1815년 인도네시아의 화산인 탐보라산이 폭발했다."},{"no":2,"en":"The explosion created a huge cloud of ash, so crops failed around the world.","ko":"이 폭발은 거대한 재 구름을 만들었고, 그래서 전 세계적으로 농작물이 자라지 못했다."},{"no":3,"en":"As a result, people didn't have enough food to eat.","ko":"그 결과, 사람들은 먹을 음식이 충분하지 않았다."},{"no":4,"en":"Surprisingly, this made traveling difficult. Why?","ko":"놀랍게도, 이로 인해 이동이 어려워졌다. 왜일까?"},{"no":5,"en":"In those days, people rode horses, but many horses were killed for food.","ko":"당시, 사람들은 말을 탔는데, 많은 말들이 식용으로 죽임을 당했다."},{"no":6,"en":"People needed a new way to travel, and Karl von Drais invented the first bicycle in Germany in 1817.","ko":"사람들은 이동하기 위한 새로운 수단이 필요했고, 1817년 독일에서 Karl von Drais가 최초의 자전거를 발명했다."},{"no":7,"en":"Drais's bicycle had two wooden wheels but no pedals. How did it move without pedals?","ko":"Drais의 자전거는 나무로 된 두 개의 바퀴가 있었지만 페달은 없었다. 페달 없이 어떻게 움직였을까?"},{"no":8,"en":"Well, riders simply pushed the bicycle forward with their feet.","ko":"음, 타는 사람들이 단순히 발로 자전거를 앞으로 밀었다."},{"no":9,"en":"The present-day bicycle is the result of many inventors' work in the 19th century.","ko":"오늘날의 자전거는 19세기 많은 발명가들의 노력의 결과이다."}]},{"id":"p2","label":"본문2 · Whiteout","sentences":[{"no":10,"en":"Whiteout was invented by Bette Graham.","ko":"수정액은 Bette Graham에 의해 발명되었다."},{"no":11,"en":"In 1956, Graham was working at a bank in Texas, USA.","ko":"1956년 Graham은 미국 텍사스의 한 은행에서 일하고 있었다."},{"no":12,"en":"At that time, people had to retype the whole page when they made even a small mistake.","ko":"그 당시, 사람들은 작은 실수 하나라도 하면 전체 페이지를 다시 입력해야 했다."},{"no":13,"en":"Graham was a bad typist, so she needed a solution.","ko":"Graham은 타자 실력이 좋지 않아서 해결책이 필요했다."},{"no":14,"en":"One day, Graham saw some window painters.","ko":"어느 날 Graham은 창문을 칠하는 페인트공 let ST = { id:null, name:null, grade:null, school:null, dialog:null, grammarDone:false };
let nav = [];
let timer = { id:null, left:0 };

const body=document.getElementById('body'), backBtn=document.getElementById('backBtn');
const timerBox=document.getElementById('timer'), timerNum=document.getElementById('timerNum');

function show(html){
  body.innerHTML=`<div class="screen on">${html}</div>`;
  backBtn.style.display = nav.length>1 ? 'block':'none';
  body.scrollTop=0; stopTimer(); timerBox.style.display='none';
}
function go(screen,push=true){ if(push) nav.push(screen); screen(); }
function goBack(){ stopTimer(); if(nav.length>1){ nav.pop(); nav[nav.length-1](); } }

function startTimer(sec,onTimeout){
  stopTimer(); timer.left=sec; timerBox.style.display='flex';
  timerBox.classList.remove('warn'); timerNum.textContent=sec;
  timer.id=setInterval(()=>{ timer.left--; timerNum.textContent=timer.left;
    if(timer.left<=5) timerBox.classList.add('warn');
    if(timer.left<=0){ stopTimer(); onTimeout&&onTimeout(); } },1000);
}
function stopTimer(){ if(timer.id){clearInterval(timer.id);timer.id=null;} timerBox.classList.remove('warn'); }

function makeOpts(correct,pool){
  const wrong=pool.filter(x=>x!==correct).sort(()=>Math.random()-.5).slice(0,3);
  return [correct,...wrong].sort(()=>Math.random()-.5);
}

/* 공용: 시트로 POST 보내고 응답 받기 (회원가입/로그인용) */
async function apiPost(payload){
  if(!SHEET_API) return null;
  try{
    const r=await fetch(SHEET_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
    return await r.json();
  }catch(e){ return null; }
}
function showMsg(el,t){ if(el){ el.style.display='block'; el.textContent=t; } }

  show(`<div class="login">
    <div style="text-align:right;margin:-4px 0 -8px">
      <button class="teacherlink" style="margin-top:0;font-size:13px" onclick="go(scSignup)">처음이면 회원가입 ›</button>

async function doLogin(){
  const id=(document.getElementById('loginId').value||'').trim();
  const pw=(document.getElementById('loginPw').value||'').trim();
  const msg=document.getElementById('loginMsg');
  if(!id||!pw){ showMsg(msg,'아이디와 비밀번호를 입력해주세요.'); return; }
  if(!SHEET_API){ showMsg(msg,'시트가 연결되지 않았어요. 선생님께 문의하세요.'); return; }
  const btn=document.getElementById('loginBtn'); if(btn){ btn.disabled=true; btn.textContent='확인 중…'; }
  const res=await apiPost({action:'login', id, pw});
  if(btn){ btn.disabled=false; btn.textContent='로그인'; }
  if(res&&res.ok){ ST.id=id; ST.name=res.name||id; go(scGrade); }
  else { showMsg(msg, !res?'연결에 실패했어요. 잠시 후 다시 시도해주세요.':res.error==='pw'?'비밀번호가 맞지 않아요.':res.error==='noid'?'없는 아이디예요. 위에서 회원가입을 먼저 해주세요.':'로그인에 실패했어요.'); }
}

async function doSignup(){
  const name=(document.getElementById('suName').value||'').trim();
  const id=(document.getElementById('suId').value||'').trim();
  const pw=(document.getElementById('suPw').value||'').trim();
  const pw2=(document.getElementById('suPw2').value||'').trim();
  const msg=document.getElementById('suMsg');
  if(!name||!id||!pw){ showMsg(msg,'이름·아이디·비밀번호를 모두 입력해주세요.'); return; }
  if(pw!==pw2){ showMsg(msg,'비밀번호가 서로 달라요.'); return; }
  if(!SHEET_API){ showMsg(msg,'시트가 연결되지 않았어요. 선생님께 문의하세요.'); return; }
  const btn=document.getElementById('suBtn'); if(btn){ btn.disabled=true; btn.textContent='가입 중…'; }
  const res=await apiPost({action:'register', id, pw, name});
  if(btn){ btn.disabled=false; btn.textContent='가입하기'; }
  if(res&&res.ok){ ST.id=id; ST.name=name; showMsg(msg,'가입 완료! 로그인 화면으로 이동해요.'); setTimeout(()=>go(scLogin),900); }
  else { showMsg(msg, !res?'연결에 실패했어요. 잠시 후 다시 시도해주세요.':res.error==='exists'?'이미 쓰고 있는 아이디예요. 다른 걸로 해주세요.':'가입에 실패했어요.'); }
}
/* ===== 기록 (기기 저장 + 구글 시트 동기화) ===== */
function recKey(){ return 'hailey_rec'; }
function loadRecs(){ try{return JSON.parse(localStorage.getItem(recKey())||'[]');}catch(e){return [];} }
function saveRec(rec){
  try{const a=loadRecs(); a.push(rec); localStorage.setItem(recKey(), JSON.stringify(a.slice(-200)));}catch(e){}
  syncRec(rec); // 시트에도 전송 (SHEET_API 있을 때만)
}
function todayStr(d){ const x=d?new Date(d):new Date(); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; }

/* 시트로 기록 전송 — 보내고 잊기(fire-and-forget). 실패해도 앱은 그대로 작동 */
function syncRec(rec){
  if(!SHEET_API) return;
  try{
    fetch(SHEET_API, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, // CORS preflight 회피
      body: JSON.stringify({ action:'save', rec: rec })
    }).catch(()=>{});
  }catch(e){}
}
/* 시트에서 기록 불러오기 — 연결 안 됐으면 null 반환(→ 기기 저장으로 대체) */
async function fetchRecs(filter){
  if(!SHEET_API) return null;
  try{
    const q = filter ? ('?'+new URLSearchParams(filter).toString()) : '';
    const r = await fetch(SHEET_API + q, { method:'GET' });
    const d = await r.json();
    return Array.isArray(d) ? d : (d.records || []);
  }catch(e){ return null; }
}

/* 선생님 화면 — 어제/오늘 기록 확인 (시트 연결 시 모든 태블릿 통합) */

/* ---------- 1차시 ---------- */
function scWordMenu(){
  const subs=[['1-1','영어 → 한국어 선택'],['1-2','한국어 → 영어 선택'],['1-3','한국어 → 영어 직접쓰기'],['1-4','영영풀이 → 단어 선택']];
  show(`<h1>1차시 · 단어</h1><p class="sub">단계를 골라요</p>
    <div class="bigcards c2">
      ${subs.map((s,i)=>`<button class="bigcard" onclick="go(()=>scWordQuiz(${i}))">
        <span class="stp">${s[0]}</span><div class="nm" style="font-size:21px">${s[1]}</div></button>`).join('')}
    </div>`);
}
function scWordQuiz(mode){
  let idx=0,score=0;
  function render(){
    const w=WORDS[idx]; let stem,opts,answer,pool;
    if(mode===0){stem=w.en;pool=WORDS.map(x=>x.ko);answer=w.ko;}
    else if(mode===1){stem=w.ko;pool=WORDS.map(x=>x.en);answer=w.en;}
    else if(mode===3){stem=`"${w.def}"`;pool=WORDS.map(x=>x.en);answer=w.en;}
    else {stem=w.ko;answer=w.en;}
    const tag=['1-1 영→한','1-2 한→영','1-3 직접쓰기','1-4 영영풀이'][mode];
    let inner=`<div class="qwrap"><div class="qhead"><span class="qtag">${tag}</span><span class="qnum">${idx+1} / ${WORDS.length}</span></div>
      <div class="qcard"><div class="stem">${stem}</div>`;
    if(mode===2){ inner+=`<input class="winput" id="wi" placeholder="영어로 입력"><div class="fb" id="fb"></div>`; }
    else { opts=makeOpts(answer,pool);
      inner+=`<div class="opts" id="opts">${opts.map((o,i)=>`<div class="opt" data-v="${o}" onclick="window.__pick(this)"><span class="ci">${CIRC[i]}</span><span>${o}</span></div>`).join('')}</div><div class="fb" id="fb"></div>`; }
    inner+=`</div></div><div class="bar"><button class="btn primary" id="chk" onclick="window.__check()">${idx<WORDS.length-1?'다음 →':'결과 보기'}</button></div>`;
    show(inner);
    startTimer(TIMER.wordMC,()=>window.__check(true));
    window.__sel=null; let answered=false;
    window.__pick=el=>{if(answered)return;document.querySelectorAll('#opts .opt').forEach(o=>o.classList.remove('sel'));el.classList.add('sel');window.__sel=el.dataset.v;};
    function adv(){ idx++; idx<WORDS.length?render():scResult('1차시 단어',score,WORDS.length); }
    window.__check=(t=false)=>{ if(answered)return; let correct;
      if(mode===2){const v=(document.getElementById('wi').value||'').trim().toLowerCase();correct=v===answer.toLowerCase();}
      else if(!window.__sel&&!t){alert('답을 선택하세요');return;}
      answered=true; stopTimer();
      if(mode!==2){document.querySelectorAll('#opts .opt').forEach(o=>{if(o.dataset.v===answer)o.classList.add('ok');else if(o.dataset.v===window.__sel)o.classList.add('no');}); correct=window.__sel===answer;}
      const fb=document.getElementById('fb');fb.className='fb on '+(correct?'good':'bad');fb.textContent=correct?'정답!':(t?'시간 초과 · ':'오답 · ')+`정답: ${answer}`;
      if(correct)score++;
      const b=document.getElementById('chk');b.disabled=true;
      setTimeout(adv,FEEDBACK_MS);
    };
  }
  render();
}

/* ---------- 2차시: 영어 빈칸 / 어법 선택 (본문 통째) ---------- */
function escR(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function norm(x){return (x||'').toLowerCase().replace(/[".,!?']/g,'').replace(/\s+/g,' ').trim();}
function scSentSrc(){
  show(`<h1>2차시 · 문장</h1><p class="sub">무엇을 풀까요?</p>
    <div class="bigcards c2">
      <button class="bigcard" onclick="go(scCloze)"><div class="nm">영어 빈칸 넣기</div><div class="ds">빈칸에 알맞은 단어 (객관식)</div></button>
      <button class="bigcard" onclick="go(scChoice)"><div class="nm">어법 선택</div><div class="ds">둘 중 알맞은 것 고르기</div></button>
    </div>`);
}
/* 영어 빈칸 — 본문 전체(cloze). 빈칸 다 채우고 '다음' 누르면 한번에 채점. 문장당 (빈칸수*15초) */
function scCloze(){
  const items = READING_DATA.cloze;
  const allAns = items.flatMap(c=>c.tokens.filter(t=>t.blank!==undefined).map(t=>t.blank));
  let idx=0,score=0,total=0,wrong=[];
  function blanksOf(c){return c.tokens.map((t,i)=>({...t,i})).filter(t=>t.blank!==undefined);}
  function render(){
    const c=items[idx]; const bl=blanksOf(c);
    let cur=0;                       // 현재 채울 빈칸
    let fill=Array(bl.length).fill(null);  // 학생이 고른 값
    let answered=false;
    function paint(){
      const html=c.tokens.map((t,i)=>{ if(t.blank===undefined) return escR(t.t);
        const k=bl.findIndex(b=>b.i===i); const v=fill[k];
        let cls='blank'+((!answered&&k===cur)?' cur':'');
        if(answered){ cls+= (v===bl[k].blank)?' done-ok':' done-no'; }
        const shown = answered ? (v||'__') : (v? escR(v) : '____');
        return `<span class="${cls}" onclick="window.__sel(${k})">${escR(shown)}</span>`;
      }).join('');
      document.getElementById('clz').innerHTML=html;
      // 현재 빈칸 선지
      if(!answered){
        const b=bl[cur]; const opts=makeOpts(b.blank, allAns.concat(['made','found','small','open']));
        document.getElementById('opts').innerHTML=opts.map((o,i)=>`<div class="clozeopt" onclick="window.__put('${escR(o)}')">${CIRC[i]} ${escR(o)}</div>`).join('');
        document.getElementById('cnt').textContent=`빈칸 ${fill.filter(x=>x!==null).length}/${bl.length}`;
      } else { document.getElementById('opts').innerHTML=''; }
      document.getElementById('chk').disabled = answered || fill.some(x=>x===null);
    }
    show(`<div class="qwrap"><div class="qhead"><span class="qtag">2차시 · 영어 빈칸</span><span class="qnum"><span id="cnt"></span> · 문장 ${idx+1}/${items.length}</span></div>
      <div class="qcard"><div class="prompt">${escR(c.ko)}</div><div class="cloze" id="clz"></div>
      <div class="clozeopts" id="opts"></div><div class="fb" id="fb"></div></div></div>
      <div class="bar"><button class="btn ghost" onclick="window.__reset()">초기화</button>
      <button class="btn primary" id="chk" onclick="window.__check()" disabled>${idx<items.length-1?'다음 →':'결과'}</button></div>`);
    startTimer(TIMER.blankMC*bl.length||TIMER.blankMC,()=>window.__check(true));
    window.__sel=(k)=>{ if(answered)return; cur=k; paint(); };       // 빈칸 직접 골라 수정
    window.__put=(v)=>{ if(answered)return; fill[cur]=v;
      // 다음 빈 칸으로 자동 이동
      const nx=fill.findIndex(x=>x===null); cur = nx>=0?nx:cur; paint(); };
    window.__reset=()=>{ if(answered)return; fill=Array(bl.length).fill(null); cur=0; paint(); };
    window.__check=(t=false)=>{ if(answered)return;
      if(fill.some(x=>x===null)&&!t){ alert('빈칸을 모두 채워주세요'); return; }
      answered=true; stopTimer();
      let allok=true;
      bl.forEach((b,k)=>{ total++; if(fill[k]===b.blank) score++; else {allok=false; wrong.push(`문장${idx+1}-빈칸${k+1}`);} });
      paint();
      const ansTxt=bl.map(b=>b.blank).join(' / ');
      const fb=document.getElementById('fb');fb.className='fb on '+(allok?'good':'bad');
      fb.innerHTML=(allok?'정답!':(t?'시간 초과 · ':'오답 · '))+`정답: ${escR(ansTxt)}`;
      document.getElementById('chk').disabled=true;
      setTimeout(()=>{ idx++; idx<items.length?render():scResult('2차시 영어 빈칸',score,total,wrong); }, FEEDBACK_MS);
    };
    paint();
  }
  if(!items.length){scResult('2차시 영어 빈칸',0,0);return;} render();
}
/* 어법 선택 — 본문 전체(choice). 문장 속 둘 중 탭 */
function scChoice(){
  const items = READING_DATA.choice; let idx=0,score=0,wrong=[];
  function render(){
    const c=items[idx];
    const html=c.tokens.map((t,ti)=>{ if(!t.opts) return escR(t.t);
      return `<span>${t.opts.map((o,oi)=>`<button class="optpick" data-ti="${ti}" data-oi="${oi+1}" onclick="window.__pick(${ti},${oi+1},this)">${escR(o)}</button>`).join('<span style="color:var(--ink-soft)"> / </span>')}</span>`;}).join('');
    show(`<div class="qwrap"><div class="qhead"><span class="qtag">2차시 · 어법 선택</span><span class="qnum">${idx+1} / ${items.length}</span></div>
      <div class="qcard"><div class="prompt">${escR(c.ko)}</div><div class="stem" style="line-height:2.1">${html}</div><div class="fb" id="fb"></div></div></div>
      <div class="bar"><button class="btn primary" id="chk" onclick="window.__check()" disabled>${idx<items.length-1?'다음 →':'결과'}</button></div>`);
    startTimer(TIMER.sentMC,()=>window.__check(true));
    window.__sel={}; let answered=false;
    window.__pick=(ti,oi,el)=>{ if(answered)return; window.__sel[ti]=oi; el.parentNode.querySelectorAll('.optpick').forEach(b=>b.classList.remove('on')); el.classList.add('on');
      const need=c.tokens.filter(t=>t.opts).length; document.getElementById('chk').disabled=Object.keys(window.__sel).length<need; };
    window.__check=(t=false)=>{ if(answered)return; answered=true; stopTimer(); let ok=true;
      c.tokens.forEach((tok,ti)=>{ if(!tok.opts)return; const pick=window.__sel[ti];
        document.querySelectorAll(`.optpick[data-ti="${ti}"]`).forEach(b=>{const oi=+b.dataset.oi; if(oi===tok.answer)b.classList.add('cpick-ok'); else if(oi===pick)b.classList.add('cpick-no');});
        if(pick!==tok.answer) ok=false; });
      if(ok)score++; else wrong.push(`${idx+1}번`);
      const fb=document.getElementById('fb');fb.className='fb on '+(ok?'good':'bad');fb.textContent=ok?'정답!':(t?'시간 초과':'오답');
      const b=document.getElementById('chk');b.disabled=true;
      setTimeout(()=>{idx++; idx<items.length?render():scResult('2차시 어법 선택',score,items.length,wrong);}, FEEDBACK_MS);
    };
  }
  if(!items.length){scResult('2차시 어법 선택',0,0);return;} render();
}

/* ---------- 3차시: 순서 배열 — 이미지처럼 단어/구 클릭 배열 (본문 통째) ---------- */
function scOrder(){
  const items = READING_DATA.order; let idx=0,score=0,wrong=[];
  function render(){
    const q=items[idx];
    const shuffled=q.chunks.map((c,i)=>({c,i})).sort(()=>Math.random()-.5);
    let picked=[];
    function paintBuilt(){
      const built=picked.map(p=>shuffled[p].c).join(' ');
      document.getElementById('built').textContent=(q.prefix?q.prefix+' ':'')+built;
    }
    function paintChips(){
      document.querySelectorAll('#pool .chip').forEach((el,pos)=>{
        const on=picked.includes(pos); el.classList.toggle('used',on);});
      document.getElementById('chk').disabled = picked.length!==shuffled.length;
      paintBuilt();
    }
    show(`<div class="qwrap"><div class="qhead"><span class="qtag">3차시 · 순서 배열</span><span class="qnum">${idx+1} / ${items.length}</span></div>
      <div class="qcard"><div class="prompt">${escR(q.ko)}</div>
      ${q.prefix?`<div class="sub" style="margin:0 0 8px">시작: <b>${escR(q.prefix)}</b></div>`:''}
      <div class="built" id="built"></div>
      <div class="chips" id="pool">${shuffled.map((s,pos)=>`<button class="chip" onclick="window.__tap(${pos})">${escR(s.c)}</button>`).join('')}</div>
      <div class="fb" id="fb"></div></div></div>
      <div class="bar"><button class="btn ghost" onclick="window.__reset()">초기화</button><button class="btn primary" id="chk" onclick="window.__check()" disabled>채점</button></div>`);
    startTimer(TIMER.arrange,()=>window.__check(true));
    let answered=false;
    window.__tap=pos=>{if(answered)return;const k=picked.indexOf(pos); if(k>=0)picked.splice(k,1); else picked.push(pos); paintChips();};
    window.__reset=()=>{if(answered)return;picked=[];paintChips();};
    window.__check=(t=false)=>{if(answered)return;answered=true;stopTimer();
      // 정답 순서 = 각 chunk가 정답 문장에서 등장하는 위치 순서
      const ansN=norm(q.answer);
      const correctOrder=q.chunks.map((c,i)=>({i,pos:ansN.indexOf(norm(c))})).sort((a,b)=>a.pos-b.pos).map(o=>o.i);
      const studentOrder=picked.map(p=>shuffled[p].i);
      const ok=studentOrder.join('|')===correctOrder.join('|');
      if(ok)score++; else wrong.push(`${idx+1}번`);
      // 올바른 칩 순서를 보기 좋게 표시
      const correctChips=correctOrder.map(i=>q.chunks[i]).join(' / ');
      const fb=document.getElementById('fb');fb.className='fb on '+(ok?'good':'bad');
      fb.innerHTML=ok?'정답!':(t?'시간 초과 · ':'오답 · ')+'올바른 순서: '+escR((q.prefix?q.prefix+' / ':'')+correctChips);
      const b=document.getElementById('chk');b.disabled=true;
      setTimeout(()=>{idx++; idx<items.length?render():scResult('3차시 순서 배열',score,items.length,wrong);}, FEEDBACK_MS);
    };
    paintChips();
  }
  if(!items.length){scResult('3차시 순서 배열',0,0);return;} render();
}

/* ---------- 4차시: 영작 (동사형 연습 / 영작, 본문 통째) ---------- */
function scWriteHub(){
  show(`<h1>4차시 · 영작</h1><p class="sub">동사형으로 감 잡고 영작으로 가요</p>
    <div class="bigcards c2">
      <button class="bigcard" onclick="go(scVerb)"><div class="nm">동사형 연습</div><div class="ds">동사를 알맞은 형태로</div></button>
      <button class="bigcard" onclick="go(scWrite)"><div class="nm">영작</div><div class="ds">한국어 보고 영어 쓰기</div></button>
    </div>`);
}
/* 동사형 — given(원형)마다 입력칸. 동사 2개면 칸 2개 */
function scVerb(){
  const items = READING_DATA.verbform; let idx=0,score=0,wrong=[];
  function render(){
    const v=items[idx]; let bi=0;
    const html=v.tokens.map(t=>{ if(t.given===undefined) return escR(t.t);
      const id='vb'+bi; bi++;
      return `<span class="inlinebox"><span class="given">(${escR(t.given)})</span><input class="winline" id="${id}" data-ans="${escR(t.answer)}" placeholder="형태"></span>`;}).join('');
    show(`<div class="qwrap"><div class="qhead"><span class="qtag">4차시 · 동사형 연습</span><span class="qnum">${idx+1} / ${items.length}</span></div>
      <div class="qcard"><div class="prompt">${escR(v.ko)}</div><div class="stem" style="line-height:2.4">${html}</div><div class="fb" id="fb"></div></div></div>
      <div class="bar"><button class="btn primary" id="chk" onclick="window.__check()">${idx<items.length-1?'다음 →':'결과'}</button></div>`);
    const first=document.querySelector('.winline'); if(first)first.focus();
    startTimer(TIMER.blankWrite*bi||TIMER.blankWrite,()=>window.__check(true));
    let answered=false;
    window.__check=(t=false)=>{if(answered)return;answered=true;stopTimer(); let ok=true; const ins=document.querySelectorAll('.winline');
      ins.forEach(inp=>{ const ans=(inp.dataset.ans||'').toLowerCase(); const val=(inp.value||'').trim().toLowerCase();
        if(val===ans){inp.style.borderColor='var(--mint)';} else {inp.style.borderColor='var(--bad)';ok=false;} });
      if(ok)score++; else wrong.push(`${idx+1}번`);
      const ansAll=[...ins].map(i=>i.dataset.ans).join(' , ');
      const fb=document.getElementById('fb');fb.className='fb on '+(ok?'good':'bad');fb.textContent=ok?'정답!':(t?'시간 초과 · ':'오답 · ')+`정답: ${ansAll}`;
      const b=document.getElementById('chk');b.disabled=true;
      setTimeout(()=>{idx++;idx<items.length?render():scResult('4차시 동사형 연습',score,items.length,wrong);}, FEEDBACK_MS);
    };
  }
  if(!items.length){scResult('4차시 동사형 연습',0,0);return;} render();
}
/* 영작 — 대소문자·온점·따옴표·띄어쓰기 무시하고 채점 */
function scWrite(){
  const items = READING_DATA.writing; let idx=0,score=0,wrong=[];
  function render(){
    const w=items[idx];
    show(`<div class="qwrap"><div class="qhead"><span class="qtag">4차시 · 영작</span><span class="qnum">${idx+1} / ${items.length}</span></div>
      <div class="qcard"><div class="prompt">${escR(w.ko)}</div>
      <div class="sub" style="margin:0 0 6px">주어진 단어: <b>${(w.words||[]).map(escR).join(', ')}</b>${w.prefix?` · 시작: ${escR(w.prefix)}`:''}</div>
      <input class="winput" id="wi" placeholder="영어로 작성"><div class="fb" id="fb"></div></div></div>
      <div class="bar"><button class="btn primary" id="chk" onclick="window.__check()">${idx<items.length-1?'다음 →':'결과'}</button></div>`);
    document.getElementById('wi').focus();
    startTimer(TIMER.blankWrite,()=>window.__check(true));
    let answered=false;
    window.__check=(t=false)=>{if(answered)return;answered=true;stopTimer();
      const ok=norm(document.getElementById('wi').value)===norm(w.answer); if(ok)score++; else wrong.push(`${idx+1}번`);
      const fb=document.getElementById('fb');fb.className='fb on '+(ok?'good':'bad');
      fb.innerHTML=(ok?'정답!':(t?'시간 초과 · 오답':'오답입니다'))+`<br><span style="font-weight:500">정답: ${escR(w.answer)}</span>`;
      const b=document.getElementById('chk');b.disabled=true;
      setTimeout(()=>{idx++;idx<items.length?render():scResult('4차시 영작',score,items.length,wrong);}, FEEDBACK_MS);
    };
  }
  if(!items.length){scResult('4차시 영작',0,0);return;} render();
}

/* ---------- 4차시: 문법 시험 (완료 시 5차시 잠금 해제) ---------- */
function escG(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function ulG(s){return escG(s).replace(/\[\[([\s\S]+?)\]\]/g,'<u>$1</u>');}      // [[밑줄]] → 밑줄 표시
function fmtG(s){return ulG(s).replace(/\n/g,'<br>');}                           // 밑줄 + 줄바꿈
function scGrammar(){ // 패턴 선택
  const pats = GRAMMAR_DATA.meta.patterns;
  show(`<h1>4차시 · 문법 시험</h1><p class="sub">${GRAMMAR_DATA.meta.grade} · ${GRAMMAR_DATA.meta.textbook} · ${GRAMMAR_DATA.meta.lesson}</p>
    <div class="bigcards c2">
      ${pats.map((p,i)=>`<button class="bigcard" onclick="go(()=>scGrammarQuiz('${p.id}'))">
        <span class="stp">패턴 ${i+1}</span><div class="nm">${p.name}</div><div class="ds">${p.count}문항</div></button>`).join('')}
    </div>
    <div class="note">패턴을 골라 풀어요. 끝까지 풀면 5차시(학교별 유형 TEST)가 열려요.</div>`);
}
function scGrammarQuiz(patId){
  const list = GRAMMAR_DATA.questions.filter(q=>q.pattern===patId);
  const patName = (GRAMMAR_DATA.meta.patterns.find(p=>p.id===patId)||{}).name||'';
  let idx=0, score=0;
  function render(){
    const q=list[idx]; const multi=q.answer.length>1;
    const passage = q.passage && q.passage.trim() ? `<div class="prompt">${fmtG(q.passage)}</div>`:'';
    show(`<div class="qwrap"><div class="qhead">
        <span class="qtag">4차시 · ${patName}${multi?' · 복수정답':''}</span>
        <span class="qnum">${idx+1} / ${list.length}</span></div>
      <div class="qcard"><div class="stem">${escG(q.prompt)}</div>${passage}
      <div class="opts" id="opts">${q.choices.map((c,i)=>`<div class="opt" data-i="${i+1}" onclick="window.__pick(this)"><span class="ci">${CIRC[i]||(i+1)}</span><span>${ulG(c)}</span></div>`).join('')}</div>
      <div class="fb" id="fb"></div></div></div>
      <div class="bar"><button class="btn primary" id="chk" onclick="window.__check()">${multi?'정답 '+q.answer.length+'개 선택 후 다음':(idx<list.length-1?'다음 →':'결과')}</button></div>`);
    startTimer(TIMER.grammarMC,()=>window.__check(true));
    window.__picks=[]; let answered=false;
    window.__pick=el=>{ if(answered)return;
      const n=+el.dataset.i;
      if(multi){
        const k=window.__picks.indexOf(n);
        if(k>=0){window.__picks.splice(k,1);el.classList.remove('sel');}
        else{window.__picks.push(n);el.classList.add('sel');}
      }else{
        document.querySelectorAll('#opts .opt').forEach(o=>o.classList.remove('sel'));
        el.classList.add('sel'); window.__picks=[n];
      }
    };
    window.__check=(t=false)=>{ if(answered)return;
      if(window.__picks.length===0&&!t){alert('답을 선택하세요');return;}
      answered=true; stopTimer();
      const ans=q.answer.slice().sort((a,b)=>a-b);
      const pk=window.__picks.slice().sort((a,b)=>a-b);
      const ok = ans.length===pk.length && ans.every((v,i)=>v===pk[i]);
      document.querySelectorAll('#opts .opt').forEach(o=>{const i=+o.dataset.i;
        if(q.answer.includes(i))o.classList.add('ok'); else if(window.__picks.includes(i))o.classList.add('no');});
      if(ok)score++;
      const ansTxt=q.answer.map(a=>CIRC[a-1]||a).join(' ');
      const fb=document.getElementById('fb');fb.className='fb on '+(ok?'good':'bad');
      fb.innerHTML=`${ok?'정답!':(t?'시간 초과 · ':'오답 · ')}정답: ${ansTxt}<br><span style="font-weight:500">${escG(q.explanation||'')}</span>`;
      const b=document.getElementById('chk');b.disabled=true;
      setTimeout(()=>{idx++; if(idx<list.length){render();} else { ST.grammarDone=true; scResult('5차시 '+patName,score,list.length); }}, FEEDBACK_MS);
    };
  }
  if(list.length===0){scResult('4차시',0,0);return;} render();
}

/* ---------- 5차시 ---------- */
function scExamHub(){
  show(`<h1>5차시 · 학교별 유형 TEST</h1><p class="sub">${ST.school.nm} 기출 유형 그대로</p>
    <div class="bigcards c2">
      <button class="bigcard" onclick="go(scCommon)"><div class="nm">공통 문제</div><div class="ds">빈칸·내용이해·배열·삽입·어휘·조건영작·문장완성</div></button>
      <button class="bigcard" onclick="go(scGrammar)"><div class="nm">어법 실전</div><div class="ds">우리 학교 어법 (PDF)</div></button>
    </div>
    <div class="note">실전은 어법(선생님 PDF) + 공통 7유형(AI 자동생성)이 우리 학교 출제 패턴대로 섞여 나와요.</div>`);
}
function scCommon(){
  const types=['빈칸 완성','내용 이해','문장 배열','문장 삽입','어휘','조건 영작','문장 완성'];
  show(`<h1>공통 문제</h1><p class="sub">7가지 유형 (본문 기반 자동생성)</p>
    <div class="bigcards c2">
      ${types.map(t=>`<button class="bigcard" onclick="alert('${t} — 실제 앱에서 AI가 본문으로 자동 출제됩니다 (뼈대 상태)')"><div class="nm" style="font-size:21px">${t}</div></button>`).join('')}
    </div>
    <div class="note">🔌 이 7유형은 헤일리님이 올린 본문/단어로 Anthropic API가 자동 생성합니다. 지금은 유형 목록만 보이는 뼈대예요.</div>`);
}

/* ---------- 결과 (기록 자동저장 + 내 기록 + 카톡 복사) ---------- */
function scResult(title,score,total,wrongList){
  const pct=total?Math.round(score/total*100):0;
  // 자동 저장
  const rec={ name:(ST.name||'학생'), school:(ST.school?ST.school.nm:''), grade:ST.grade||'',
    title, score, total, pct, date:todayStr(), at:Date.now(), wrong:(wrongList||[]) };
  saveRec(rec);
  window.__lastRec=rec;
  show(`<div class="result"><div class="big">${pct}%</div>
    <div class="lab">${title} · ${total}문항 중 ${score}문항 정답</div></div>
    <div class="bar" style="max-width:640px">
      <button class="btn ghost" onclick="go(scMyRecords)" style="flex:1">내 기록 보기</button>
      <button class="btn primary" onclick="window.__kakao()" style="flex:1">카톡 복사하기</button>
    </div>
    <div class="bar" style="max-width:640px;margin-top:10px">
      <button class="btn ghost" onclick="nav=[scLogin,scGrade,scSchool,scHub];scHub()" style="flex:1">차시로</button>
      <button class="btn primary" onclick="goBack()" style="flex:1">다시 풀기</button>
    </div>
    <div class="note" id="copynote">${SHEET_API?'결과가 선생님 시트로 자동 전송됐어요.':'결과는 이 기기에 자동 저장됐어요. \"카톡 복사하기\"로 선생님께 보낼 수 있어요.'}</div>`);
  backBtn.style.display='block';
  window.__kakao=()=>{
    const w=rec.wrong&&rec.wrong.length?('\n틀린 문제: '+rec.wrong.join(', ')):'';
    const txt=`[헤일리 중등부] ${rec.name} (${rec.school})\n${rec.title}\n점수: ${rec.score}/${rec.total} (${rec.pct}%)\n날짜: ${rec.date}${w}`;
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(()=>{document.getElementById('copynote').textContent='복사됐어요! 카톡에 붙여넣어 선생님께 보내세요.';}); }
    else { prompt('아래 내용을 복사해서 카톡으로 보내세요', txt); }
  };
}
/* 내 기록 보기 (오답노트용) */
function scMyRecords(){
  const recs=loadRecs().slice().reverse();
  const rows = recs.length? recs.map(r=>`<div class="trow"><span>${r.date} · ${r.title}</span><span>${r.score}/${r.total} (${r.pct}%)${r.wrong&&r.wrong.length?' · 오답 '+r.wrong.length:''}</span></div>`).join('') : '<div class="trow" style="color:var(--ink-soft)">아직 기록이 없어요</div>';
  show(`<h1>내 기록</h1><p class="sub">차시별 결과 · 오답노트에 활용하세요</p>
    <div class="qcard" style="max-width:760px;margin:0 auto">${rows}</div>
    <div class="bar"><button class="btn primary" onclick="goBack()">돌아가기</button></div>`);
  backBtn.style.display='block';
}

nav=[scLogin]; scLogin();
</script>
